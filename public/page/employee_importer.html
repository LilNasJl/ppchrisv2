<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Importer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0b0d10;--panel:#151922;--panel2:#10141b;--border:#273142;--text:#d9e3ef;--muted:#8392a8;--accent:#13b981;--bad:#ef4444;--warn:#f59e0b;--blue:#60a5fa;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}header{padding:18px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}header:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}h1{font-size:17px;margin:0;letter-spacing:1.5px;text-transform:uppercase}main{max-width:1280px;margin:0 auto;padding:26px}.grid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:20px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px}.drop{border:1px dashed var(--border);border-radius:8px;padding:34px 20px;text-align:center;background:var(--panel2);cursor:pointer}.drop.drag,.drop:hover{border-color:var(--accent)}.drop strong{display:block;margin-bottom:6px}.drop span{color:var(--muted);font-size:13px}.field{margin-top:16px}.field label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}input[type=file]{display:none}button,input{font:inherit}.text-input{width:100%;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);padding:10px 12px;outline:none}.text-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(19,185,129,.18)}.text-input::placeholder{color:var(--muted)}.btn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:5px;padding:9px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);color:#04110d}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.bad{border-color:var(--bad);color:var(--bad)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:13px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel2);max-height:520px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;background:#0d1118}td{color:var(--text)}.empty{color:var(--muted);padding:44px;text-align:center}.msg{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.45}.ok{color:var(--accent)}.bad-text{color:var(--bad)}.warn{color:var(--warn)}.errors{margin-top:14px;max-height:220px;overflow:auto}.err{border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.08);color:#fecaca;border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13px}@media(max-width:850px){main{padding:14px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Employee Importer</h1></header>
<main>
  <div class="grid">
    <section class="panel">
      <div class="drop" id="drop">
        <strong>Drop employee CSV or Excel file</strong>
        <span>Accepted: .csv, .xlsx, .xls</span>
        <input id="file" type="file" accept=".csv,.xlsx,.xls">
      </div>
      <div class="field">
        <label for="importName">Import Name</label>
        <input class="text-input" id="importName" type="text" maxlength="191" placeholder="e.g., June 2026 employee accounts">
      </div>
      <div class="actions">
        <button class="btn" id="choose">Choose File</button>
        <button class="btn primary" id="import" disabled>Import Employees</button>
        <button class="btn bad" id="clear" disabled>Clear</button>
      </div>
      <div class="msg" id="status">No file selected.</div>
    </section>
    <section>
      <div class="stats">
        <div class="stat"><b id="total">0</b><span>Total rows</span></div>
        <div class="stat"><b id="success" class="ok">0</b><span>Imported</span></div>
        <div class="stat"><b id="failed" class="bad-text">0</b><span>Failed</span></div>
      </div>
      <div class="table-wrap"><table><thead id="head"></thead><tbody id="body"><tr><td class="empty">Preview will appear here.</td></tr></tbody></table></div>
      <div class="errors" id="errors"></div>
    </section>
  </div>
</main>
<script>
const params=new URLSearchParams(location.search);
const endpoint=params.get('endpoint')||'/hr-tools/import/employees';
const csrf=params.get('csrf')||'';
const chunkSize=100;
let rows=[];
let batchId='';
const el=id=>document.getElementById(id);

el('choose').onclick=()=>el('file').click();
el('file').onchange=e=>loadFile(e.target.files[0]);
el('clear').onclick=reset;
el('import').onclick=runImport;
['dragenter','dragover'].forEach(ev=>el('drop').addEventListener(ev,e=>{e.preventDefault();el('drop').classList.add('drag')}));
['dragleave','drop'].forEach(ev=>el('drop').addEventListener(ev,e=>{e.preventDefault();el('drop').classList.remove('drag')}));
el('drop').addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));

async function loadFile(file){
  if(!file)return;
  try{
    setStatus('Reading '+file.name+' ...');
    const data=await file.arrayBuffer();
    if(typeof XLSX==='undefined')throw new Error('Spreadsheet library is not loaded.');
    const wb=XLSX.read(data,{type:'array',cellDates:false});
    const ws=wb.Sheets[wb.SheetNames[0]];
    rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
    rows=rows.filter(row=>Object.values(row).some(v=>String(v??'').trim()!==''));
    renderPreview();
    el('import').disabled=!rows.length;
    el('clear').disabled=!rows.length;
    el('total').textContent=rows.length;
    setStatus(rows.length?('Ready to import '+rows.length+' row(s).'):'No usable rows found.');
  }catch(err){
    reset();
    setStatus(err.message,true);
  }
}

function renderPreview(){
  const cols=Object.keys(rows[0]||{}).slice(0,10);
  el('head').innerHTML=cols.length?'<tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>':'';
  el('body').innerHTML=rows.length
    ? rows.slice(0,25).map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c]??'')+'</td>').join('')+'</tr>').join('')
    : '<tr><td class="empty">Preview will appear here.</td></tr>';
}

async function runImport(){
  if(!rows.length)return;
  const importName=el('importName').value.trim();
  if(!importName){
    setStatus('Please enter an import name before importing.',true);
    el('importName').focus();
    return;
  }
  batchId='EMP-'+Date.now()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
  el('import').disabled=true;
  el('errors').innerHTML='';
  el('success').textContent='0';
  el('failed').textContent='0';
  let ok=0,bad=0;
  for(let i=0;i<rows.length;i+=chunkSize){
    const chunk=rows.slice(i,i+chunkSize);
    setStatus('Importing rows '+(i+1)+'-'+Math.min(i+chunkSize,rows.length)+' of '+rows.length+' ...');
    const json=await postRows(chunk,importName,batchId);
    ok+=json.successful||0;
    bad+=json.failed||0;
    el('success').textContent=ok;
    el('failed').textContent=bad;
    renderErrors(json.errors||[],i);
  }
  setStatus('Import complete: '+ok+' imported, '+bad+' failed.', bad>0);
}

async function postRows(chunk,importName,batchId){
  const res=await fetch(endpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json','X-Requested-With':'XMLHttpRequest','X-CSRF-TOKEN':csrf},
    body:JSON.stringify({import_name:importName,batch_id:batchId,rows:chunk})
  });
  const json=await res.json().catch(()=>({message:'Invalid server response.'}));
  if(!res.ok)throw new Error(json.message||'Import request failed.');
  return json;
}

function renderErrors(errors,offset){
  if(!errors.length)return;
  el('errors').insertAdjacentHTML('beforeend',errors.map(e=>'<div class="err">Row '+(offset+(e.row||0))+': '+esc(e.message||'Failed')+'</div>').join(''));
}

function reset(){
  rows=[];batchId='';el('file').value='';el('importName').value='';el('total').textContent='0';el('success').textContent='0';el('failed').textContent='0';
  el('head').innerHTML='';el('body').innerHTML='<tr><td class="empty">Preview will appear here.</td></tr>';el('errors').innerHTML='';
  el('import').disabled=true;el('clear').disabled=true;setStatus('No file selected.');
}
function setStatus(msg,bad=false){el('status').textContent=msg;el('status').className='msg '+(bad?'bad-text':'');}
function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
</script>
</body>
</html>
