<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTR Importer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0b0d10;--panel:#151922;--panel2:#10141b;--border:#273142;--text:#d9e3ef;--muted:#8392a8;--accent:#13b981;--bad:#ef4444;--warn:#f59e0b;--blue:#60a5fa;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}header{padding:18px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}header:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}h1{font-size:17px;margin:0;letter-spacing:1.5px;text-transform:uppercase}main{max-width:1320px;margin:0 auto;padding:26px}.grid{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px}.drop{border:1px dashed var(--border);border-radius:8px;padding:34px 20px;text-align:center;background:var(--panel2);cursor:pointer}.drop.drag,.drop:hover{border-color:var(--accent)}.drop strong{display:block;margin-bottom:6px}.drop span{color:var(--muted);font-size:13px}.field{margin-top:16px}.field label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}.field input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px 12px;outline:none}.field input:focus{border-color:var(--accent)}input[type=file]{display:none}button,input{font:inherit}.btn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:5px;padding:9px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);color:#04110d}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.bad{border-color:var(--bad);color:var(--bad)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:13px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel2);max-height:520px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;background:#0d1118}td{color:var(--text)}.empty{color:var(--muted);padding:44px;text-align:center}.msg{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.45}.ok{color:var(--accent)}.bad-text{color:var(--bad)}.warn{color:var(--warn)}.errors{margin-top:14px;max-height:220px;overflow:auto}.err{border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.08);color:#fecaca;border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13px}@media(max-width:900px){main{padding:14px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>D.T.R Importer</h1></header>
<main>
  <div class="grid">
    <section class="panel">
      <div class="drop" id="drop">
        <strong>Drop D.T.R CSV or Excel file</strong>
        <span>Use the file exported from D.T.R Viewer</span>
        <input id="file" type="file" accept=".csv,.xlsx,.xls">
      </div>
      <div class="field">
        <label for="importName">Import Name</label>
        <input id="importName" maxlength="191" placeholder="e.g. May 2026 payroll D.T.R">
      </div>
      <div class="actions">
        <button class="btn" id="choose">Choose File</button>
        <button class="btn primary" id="import" disabled>Import D.T.R</button>
        <button class="btn bad" id="clear" disabled>Clear</button>
      </div>
      <div class="msg" id="status">No file selected.</div>
    </section>
    <section>
      <div class="stats">
        <div class="stat"><b id="total">0</b><span>Total rows</span></div>
        <div class="stat"><b id="success" class="ok">0</b><span>Imported</span></div>
        <div class="stat"><b id="failed" class="bad-text">0</b><span>Failed</span></div>
        <div class="stat"><b id="batch" class="warn">-</b><span>Batch</span></div>
      </div>
      <div class="table-wrap"><table><thead id="head"></thead><tbody id="body"><tr><td class="empty">Preview will appear here.</td></tr></tbody></table></div>
      <div class="errors" id="errors"></div>
    </section>
  </div>
</main>
<script>
const params=new URLSearchParams(location.search);
const endpoint=params.get('endpoint')||'/hr-tools/import/dtr';
const csrf=params.get('csrf')||'';
let rows=[];
let fallbackBatch=genBatchId();
const el=id=>document.getElementById(id);

el('choose').onclick=()=>el('file').click();
el('file').onchange=e=>loadFile(e.target.files[0]);
el('clear').onclick=reset;
el('import').onclick=runImport;
el('importName').oninput=()=>{el('import').disabled=!(rows.length&&el('importName').value.trim())};
['dragenter','dragover'].forEach(ev=>el('drop').addEventListener(ev,e=>{e.preventDefault();el('drop').classList.add('drag')}));
['dragleave','drop'].forEach(ev=>el('drop').addEventListener(ev,e=>{e.preventDefault();el('drop').classList.remove('drag')}));
el('drop').addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));

async function loadFile(file){
  if(!file)return;
  try{
    setStatus('Reading '+file.name+' ...');
    const data=await file.arrayBuffer();
    if(typeof XLSX==='undefined')throw new Error('Spreadsheet library is not loaded.');
    const wb=XLSX.read(data,{type:'array',cellDates:false});
    const ws=wb.Sheets[wb.SheetNames[0]];
    rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
    rows=rows.filter(row=>Object.values(row).some(v=>String(v??'').trim()!==''));
    fallbackBatch=detectBatch(rows)||genBatchId();
    el('batch').textContent=fallbackBatch;
    renderPreview();
    el('import').disabled=!(rows.length&&el('importName').value.trim());
    el('clear').disabled=!rows.length;
    el('total').textContent=rows.length;
    setStatus(rows.length?('Ready to import '+rows.length+' row(s).'):'No usable rows found.');
  }catch(err){
    reset();
    setStatus(err.message,true);
  }
}

function renderPreview(){
  const preferred=['Batch ID','Period ID','Branch ID','Fingerprint ID','Date In','Time In','Date Out','Time Out','Schedule Type'];
  const keys=Object.keys(rows[0]||{});
  const cols=[...preferred.filter(c=>keys.includes(c)),...keys.filter(c=>!preferred.includes(c))].slice(0,12);
  el('head').innerHTML=cols.length?'<tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>':'';
  el('body').innerHTML=rows.length
    ? rows.slice(0,25).map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c]??'')+'</td>').join('')+'</tr>').join('')
    : '<tr><td class="empty">Preview will appear here.</td></tr>';
}

async function runImport(){
  const importName=el('importName').value.trim();
  if(!rows.length||!importName)return setStatus('Import name and file are required.',true);
  el('import').disabled=true;
  el('errors').innerHTML='';
  el('success').textContent='0';
  el('failed').textContent='0';
  try{
    setStatus('Validating '+rows.length+' row(s) before saving ...');
    const json=await postRows(rows,importName);
    const ok=json.successful||0;
    const bad=json.failed||0;
    el('success').textContent=ok;
    el('failed').textContent=bad;
    if(json.batch_id)el('batch').textContent=json.batch_id;
    renderErrors(json.errors||[],0);
    setStatus(json.message||('Import complete: '+ok+' imported, '+bad+' failed.'), bad>0);
  }catch(err){
    setStatus(err.message||'Import request failed.',true);
  }finally{
    el('import').disabled=!(rows.length&&el('importName').value.trim());
  }
}

async function postRows(chunk,importName){
  const res=await fetch(endpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json','X-Requested-With':'XMLHttpRequest','X-CSRF-TOKEN':csrf},
    body:JSON.stringify({rows:chunk,import_name:importName,batch_id:fallbackBatch})
  });
  const json=await res.json().catch(()=>({message:'Invalid server response.'}));
  if(!res.ok)throw new Error(json.message||'Import request failed.');
  return json;
}

function detectBatch(data){
  for(const row of data){
    for(const key of Object.keys(row)){
      if(norm(key)==='batch_id'&&String(row[key]??'').trim())return String(row[key]).trim();
    }
  }
  return '';
}
function genBatchId(){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';let id='';for(let i=0;i<12;i++)id+=chars[Math.floor(Math.random()*chars.length)];return id;}
function renderErrors(errors,offset){if(!errors.length)return;el('errors').insertAdjacentHTML('beforeend',errors.map(e=>'<div class="err">Row '+(offset+(e.row||0))+': '+esc(e.message||'Failed')+'</div>').join(''));}
function reset(){rows=[];fallbackBatch=genBatchId();el('file').value='';el('total').textContent='0';el('success').textContent='0';el('failed').textContent='0';el('batch').textContent='-';el('head').innerHTML='';el('body').innerHTML='<tr><td class="empty">Preview will appear here.</td></tr>';el('errors').innerHTML='';el('import').disabled=true;el('clear').disabled=true;setStatus('No file selected.');}
function norm(v){return String(v).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');}
function setStatus(msg,bad=false){el('status').textContent=msg;el('status').className='msg '+(bad?'bad-text':'');}
function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
</script>
</body>
</html>
